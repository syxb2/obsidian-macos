name: Feature request
description: Suggest a change to the theme
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This theme is a frozen build of Baseline: the look is fixed on purpose,
        and most requests are better served by
        [Style Settings presets](https://github.com/aaaaalexis/obsidian-baseline)
        or by editing `theme.css` yourself. Still, suggestions are welcome.

  - type: textarea
    id: problem
    attributes:
      label: What is the problem
      description: What looks wrong or gets in your way? Screenshots help.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
      description: Describe the result, not necessarily the CSS.
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Where does this apply
      options: [desktop only, mobile only, both]
      multiple: true
    validations:
      required: true

  - type: checkboxes
    id: mobile
    attributes:
      label: Mobile
      options:
        - label: I understand mobile is deliberately left untouched, so this change would be desktop-only.
          required: false
