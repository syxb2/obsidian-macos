# 每次推 main 或开 PR 时跑：编译一遍，确认产物与源码一致、元数据四处同步。
# 本地对应的检查就是 AGENTS.md「提交前」那一节。

name: Version check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（dart-sass）
        run: npm ci

      - name: 编译主题
        run: npm run build

      - name: theme.css 与 src/ 编译结果一致
        run: |
          if ! git diff --exit-code -- theme.css; then
            echo "::error::theme.css 与 src/ 的编译结果不一致，先本地跑 npm run build 并提交"
            exit 1
          fi

      - name: src/ 里没有 Style Settings
        run: |
          if grep -rq "@settings" src/; then
            echo "::error::src/ 里出现了 @settings，本主题不允许 Style Settings"
            exit 1
          fi

      - name: theme.css 完整性
        run: |
          # 无 BOM
          if [ "$(head -c 3 theme.css | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
            echo "::error::theme.css 带 BOM"
            exit 1
          fi
          # 花括号数量平衡
          opens="$(tr -cd '{' < theme.css | wc -c | tr -d ' ')"
          closes="$(tr -cd '}' < theme.css | wc -c | tr -d ' ')"
          if [ "$opens" != "$closes" ]; then
            echo "::error::theme.css 花括号不平衡：{ $opens 个 / } $closes 个"
            exit 1
          fi
          # 主题名与派生基线
          for s in obsidian-macos "Baseline 3.2.12"; do
            if ! grep -qF "$s" theme.css; then
              echo "::error::theme.css 里找不到 $s"
              exit 1
            fi
          done

      - name: 四处版本号与 versions.json 一致
        run: |
          node --input-type=commonjs - <<'JS'
          const fs = require("fs");
          const read = (file) => JSON.parse(fs.readFileSync(file, "utf8"));
          const pkg = read("package.json");
          const lock = read("package-lock.json");
          const manifest = read("manifest.json");
          const versions = read("versions.json");

          const problems = [];
          const same = (label, value) => {
            if (value !== manifest.version) {
              problems.push(`${label} 是 ${value}，manifest.json 是 ${manifest.version}`);
            }
          };

          same("package.json", pkg.version);
          same("package-lock.json 顶层", lock.version);
          same("package-lock.json packages[\"\"]", lock.packages[""].version);

          if (versions[manifest.version] !== manifest.minAppVersion) {
            problems.push(
              `versions.json 里 ${manifest.version} 对应 ${
                versions[manifest.version]
              }，manifest.minAppVersion 是 ${manifest.minAppVersion}`,
            );
          }
          if (Object.keys(versions)[0] !== manifest.version) {
            problems.push(
              `versions.json 最新的键是 ${Object.keys(versions)[0]}，应该是 ${manifest.version}`,
            );
          }

          if (problems.length > 0) {
            for (const problem of problems) {
              console.error(`::error::${problem}`);
            }
            process.exit(1);
          }
          console.log(`元数据一致，版本 ${manifest.version}`);
          JS
